# Kadraj Android uygulaması (APK). GitHub derler; main dalında indirme bağlantısına koyar:
# https://github.com/kadrajsosyalmedya/Kadraj/releases/latest/download/kadraj.apk
# Uygulama siteyi açar (android-app/capacitor.config.json server.url), bu yüzden site güncellemeleri APK'sız gelir;
# APK yalnızca android-app/ değişince yeniden üretilir. Diğer dallarda yalnızca derleme denenir (indirme bağlantısı değişmez).
name: Kadraj APK
on:
  workflow_dispatch:
    inputs:
      yeni_imza:
        description: "İmza anahtarı kaybolduysa yenisini oluştur (eski uygulama kaldırılıp yenisi kurulmalı)"
        type: boolean
        default: false
  push:
    paths: ["android-app/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Her derlemede aynı imza: imza anahtarı önbellekte saklanır. GitHub 7 gün kullanılmayan önbelleği siler (29 Ekim 2026'da
      # böyle oldu, imza değişti, telefonda "paket çakışıyor" hatası çıktı); apk-imza.yml önbelleği 3 günde bir okuyup canlı tutar.
      # main'de anahtar bulunamazsa derleme durur (sessizce yeni imza çıkmasın); bilerek yenilemek için elle çalıştırıp yeni_imza seç.
      - name: İmza anahtarı
        uses: actions/cache@v4
        with:
          path: ~/.android/kadraj.keystore
          key: kadraj-imza-${{ github.ref_name }}-v2
      - name: Anahtar yoksa oluştur
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/kadraj.keystore ] && [ "${{ github.ref_name }}" = "main" ] && [ "${{ inputs.yeni_imza }}" != "true" ]; then
            echo "::error::main imza anahtarı önbellekte yok. Yeni imza telefondaki uygulamayla çakışır. Bilerek yenilemek için iş akışını elle yeni_imza ile çalıştır."; exit 1
          fi
          [ -f ~/.android/kadraj.keystore ] || keytool -genkeypair -v -keystore ~/.android/kadraj.keystore -storepass kadraj-android -keypass kadraj-android -alias kadraj -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kadraj, O=Kadraj, C=TR"
          keytool -list -keystore ~/.android/kadraj.keystore -storepass kadraj-android | tail -2
      - name: Capacitor projesi
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          bash yama.sh
          npx cap sync android
      - name: Derle
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk kadraj.apk && ls -la kadraj.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs kadraj.apk | head -3 || true
      - name: Deneme dosyası (main dışı)
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: kadraj-apk-deneme
          path: kadraj.apk
      - name: İndirme bağlantısına koy (main)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kadraj-apk -y --cleanup-tag || true
          gh release create kadraj-apk kadraj.apk --title "Kadraj Android" --target "${{ github.sha }}" --latest --notes "Telefona indir ve kur. Kurulumda 'bilinmeyen kaynak' izni ve Play Protect uyarısı çıkabilir: Yine de yükle. Site güncellemeleri uygulamaya kendiliğinden gelir."
