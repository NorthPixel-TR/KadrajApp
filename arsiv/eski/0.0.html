<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kadraj 0.0 (tahmini)</title><style>
:root{--bg:#fafafa;--card:#fff;--fg:#1b1b1b;--mut:#777;--line:#e4e4e4;--acc:#3B82F6;--r:4px;font-family:Georgia,serif}
.dark{--bg:#111;--card:#1b1b1b;--fg:#eee;--mut:#999;--line:#2c2c2c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.tb{background:#FFF4D6;color:#5A4300;font-size:12.5px;line-height:1.4;padding:8px 14px;border-bottom:1px solid #EBD9A6}
.tb b{font-weight:700}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--fg)}
header .sp{flex:1}.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}.ib svg{width:22px;height:22px}
main{max-width:520px;margin:0 auto;padding-bottom:80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px}.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.ph{aspect-ratio:1;width:100%;display:block}
.act{display:flex;align-items:center;gap:14px;padding:8px 12px}.act svg{width:24px;height:24px}
.lk.on svg{fill:#E0245E;stroke:#E0245E}.cnt{padding:0 12px;font-weight:700;font-size:14px}.cap{padding:4px 12px 12px;font-size:14px}.cap b{margin-right:5px}
.cm{padding:0 12px 10px;font-size:13.5px}.cm div{margin:3px 0}.cm form{display:flex;gap:6px;margin-top:6px}.cm input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:7px 12px;font:inherit}
.st{display:flex;gap:12px;overflow-x:auto;padding:12px;background:var(--card);border-bottom:1px solid var(--line)}
.st button{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--mut)}.st .av{width:58px;height:58px;font-size:18px;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:8px 0 10px;z-index:6}
nav button{display:grid;justify-items:center;font-size:10.5px;color:var(--mut);gap:2px;min-width:56px}nav button.on{color:var(--fg)}nav svg{width:24px;height:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:2px}.grid .ph{border-radius:0}
.ph0{background:var(--line)}.prof{display:flex;gap:18px;align-items:center;padding:18px 16px}.prof .av{width:76px;height:76px;font-size:26px}
.stats{display:flex;gap:18px;font-size:13px}.stats b{display:block;font-size:16px}.bio{padding:0 16px 12px;font-size:14px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 140px)}.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:75%;padding:8px 12px;border-radius:18px;background:var(--line);font-size:14px;align-self:flex-start}.msg.me{align-self:flex-end;background:var(--acc);color:#fff}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--card)}.cin input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:9px 14px;font:inherit}
.sbtn{background:var(--acc);color:#fff;border-radius:20px;padding:8px 16px;font-weight:700}
.note{margin:12px;padding:22px 18px;border-radius:var(--r);color:#fff;font-size:18px;font-weight:700;background:linear-gradient(135deg,#0C7A63,#2BC48E)}
.poll{padding:0 12px 12px}.poll button{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:6px;position:relative;overflow:hidden}
.poll button i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 22%,transparent);z-index:0}.poll button span{position:relative}
.sv{position:fixed;inset:0;background:#000;z-index:20;display:grid;place-items:center}.sv .bar{position:absolute;top:10px;left:10px;right:10px;height:3px;background:#ffffff55;border-radius:3px;overflow:hidden}
.sv .bar i{display:block;height:100%;width:0;background:#fff;animation:svb 4s linear forwards}@keyframes svb{to{width:100%}}
.sv .ph{max-width:420px;border-radius:12px}.sv .who{position:absolute;top:22px;left:14px;color:#fff;font-weight:700;font-size:14px}
.share svg{width:24px;height:24px;flex:none}.share{margin:12px;padding:12px;border:1px dashed var(--line);border-radius:var(--r);display:flex;gap:10px;align-items:center;justify-content:center;color:var(--mut);font-size:14px}
.sh{margin:12px;padding:10px 12px;border-radius:var(--r);background:color-mix(in srgb,var(--acc) 12%,var(--card));font-size:13px;color:var(--fg)}
.empty{padding:40px 16px;text-align:center;color:var(--mut);font-size:14px}
@media (prefers-reduced-motion:reduce){.sv .bar i{animation:none;width:100%}}
</style></head><body><div class="tb"><b>Kadraj 0.0 · tahmini yeniden yapım.</b> <b>İlk fikir.</b> Bu sürümün gerçek dosyası kayıp, hatırlananlara göre yeniden çizildi. Her şeyin başladığı tek sayfa: üç fotoğraf kartı ve beğen düğmesi. Henüz menü, profil ya da kayıt yok.</div><div id="app"></div>
<script>
"use strict";
const F={},STAGE=0;
const IC={heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-9.2-8.6C1.4 8.6 3.1 5 6.6 5c2.1 0 3.4 1.2 5.4 3.2C14 6.2 15.3 5 17.4 5c3.5 0 5.2 3.6 3.8 6.4C19 15.6 12 20 12 20z"/></svg>',
 cm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
 add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SCN=[["#FDB99B","#CF8BF3","#5B4B8A"],["#A1C4FD","#C2E9FB","#3A6073"],["#F6D365","#FDA085","#8E3B46"],["#84FAB0","#8FD3F4","#2F5D62"],["#FBC2EB","#A6C1EE","#4B3F72"],["#FFE29F","#FFA99F","#6B3E26"],["#C1DFC4","#DEECDD","#3E5641"],["#E0C3FC","#8EC5FC","#30475E"],["#F093FB","#F5576C","#4A1942"]];
function photo(i){const c=SCN[i%SCN.length];const sx=20+(i*37)%60;
 return`<svg class="ph" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g${i})"/><circle cx="${sx}" cy="${30+(i%3)*6}" r="${8+(i%4)}" fill="#fff" opacity=".85"/><path d="M0 ${70+(i%3)*3} L${18+i%9} ${52+(i%4)*3} L${40+i%7} ${66} L${62} ${48+(i%5)*2} L${85} ${64} L100 ${56} V100 H0Z" fill="${c[2]}" opacity=".9"/><path d="M0 84 L30 74 L58 82 L100 72 V100 H0Z" fill="${c[2]}"/></svg>`}
const U=[["ayse","Ayşe","#E1306C"],["can","Can","#3B82F6"],["zeynep","Zeynep","#F59E0B"],["mert","Mert","#10B981"],["elif","Elif","#8B5CF6"]];
const ME=["ben","Ben","#0C7A63"];
const av=(u,cls="")=>`<span class="av ${cls}" style="background:${u[2]}">${esc(u[1][0])}</span>`;
const CAPS=["Gün batımı harikaydı","Hafta sonu kaçamağı","Sabah kahvesi","Okul çıkışı","Deniz kenarı","Bugünün manzarası","Yürüyüş","Kampta bir akşam","Bulutlar"];
let posts=[...Array(STAGE?9:3)].map((_,i)=>({id:i,u:U[i%U.length],img:i,cap:CAPS[i],likes:F.count?7+((i*13)%40):0,on:false,cm:F.comments&&i%2===0?[[U[(i+1)%5],"Çok güzel olmuş"]]:[]}));
if(F.polls)posts.splice(1,0,{id:"p",u:U[1],poll:{q:"Hafta sonu ne yapalım?",o:["Sinema","Maç","Piknik"],v:[3,5,2],my:-1}});
if(F.notes)posts.splice(3,0,{id:"n",u:U[2],note:"Yarın sınav var, herkese kolay gelsin"});
let tab="feed",dark=false,msgs=[[U[0],"Selam, yeni sürümü gördün mü?"],[ME,"Evet, sohbet de gelmiş"],[U[0],"Ama sen beni ekleyemiyorsun galiba"]];
function postHtml(p){
 if(p.note)return`<div class="note">${esc(p.note)}<div style="font-size:12px;font-weight:600;opacity:.85;margin-top:8px">@${esc(p.u[0])} · not</div></div>`;
 if(p.poll){const t=p.poll.v.reduce((a,b)=>a+b,0);return`<article class="card"><div class="ch">${av(p.u)}<b>${esc(p.u[0])}</b></div><div class="cap"><b>Anket</b>${esc(p.poll.q)}</div><div class="poll">${p.poll.o.map((o,i)=>`<button data-vote="${i}"><i style="width:${p.poll.my>=0?Math.round(p.poll.v[i]/t*100):0}%"></i><span>${esc(o)}${p.poll.my>=0?" · %"+Math.round(p.poll.v[i]/t*100):""}</span></button>`).join("")}</div></article>`}
 return`<article class="card"><div class="ch">${av(p.u)}<b>${esc(p.u[0])}</b></div>${p.src?`<img class="ph" src="${p.src}" alt="" style="object-fit:cover">`:photo(p.img)}
 <div class="act"><button class="lk ${p.on?"on":""}" data-like="${p.id}" aria-label="Beğen">${IC.heart}</button>${F.comments?`<span>${IC.cm}</span>`:""}</div>
 ${F.count?`<div class="cnt">${p.likes} beğenme</div>`:""}${F.captions?`<div class="cap"><b>${esc(p.u[0])}</b>${esc(p.cap||"")}</div>`:""}
 ${F.comments?`<div class="cm">${p.cm.map(([u,t])=>`<div><b>${esc(u[0])}</b> ${esc(t)}</div>`).join("")}<form data-cf="${p.id}"><input placeholder="Yorum ekle…" maxlength="120"><button class="sbtn" type="submit">Gönder</button></form></div>`:""}</article>`}
function feed(){return`${F.stories?`<div class="st">${U.map((u,i)=>`<button data-story="${i}">${av(u)}<span>${esc(u[0])}</span></button>`).join("")}</div>`:""}
 ${F.shared?`<div class="sh"><b>Ortak alan:</b> paylaşımlar herkese görünecekti ama Claude'da paylaşılan sürümü arkadaşlar düzenleyemiyordu; yalnızca bakabildiler.</div>`:""}
 ${F.create?`<label class="share">${IC.add}<span>Fotoğraf paylaş</span><input type="file" accept="image/*" id="pick" hidden></label>`:""}${posts.map(postHtml).join("")}`}
function explore(){return`<div class="grid">${[...Array(15)].map((_,i)=>photo(i+3)).join("")}</div>`}
function profile(){const mine=posts.filter(p=>p.u===ME);return`<div class="prof">${av(ME)}<div><b style="font-size:17px">${esc(ME[1])}</b><div class="stats"><span><b>${mine.length}</b>paylaşım</span><span><b>${U.length}</b>takipçi</span><span><b>${U.length}</b>takip</span></div></div></div>
 <div class="bio">${STAGE<2?"Merhaba, bu benim profilim.":"Kadraj'ı yapan kişi"}</div><div class="grid">${mine.length?mine.map(p=>p.src?`<img class="ph" src="${p.src}" style="object-fit:cover" alt="">`:photo(p.img)).join(""):[...Array(6)].map((_,i)=>photo(i+11)).join("")}</div>`}
function chat(){return`<div class="chat"><div class="msgs" id="ms">${msgs.map(([u,t])=>`<div class="msg ${u===ME?"me":""}">${esc(t)}</div>`).join("")}</div><form class="cin" id="cf"><input placeholder="Mesaj yaz…" maxlength="300"><button class="sbtn" type="submit">Gönder</button></form></div>`}
function render(){document.body.classList.toggle("dark",dark);const title=F.brand?"kadraj":(STAGE===0?"Fotoğraflarım":"Kadraj");
 const body=tab==="explore"?explore():tab==="profile"?profile():tab==="chat"?chat():feed();
 const tabs=[["feed","Akış",IC.home],["explore","Keşfet",IC.search],...(F.chat?[["chat","Sohbet",IC.chat]]:[]),["profile","Profil",IC.user]];
 document.getElementById("app").innerHTML=`${F.head||F.nav?`<header><h1>${title}</h1><span class="sp"></span>${F.dark?`<button class="ib" id="dk" aria-label="Karanlık mod">${IC.moon}</button>`:""}</header>`:`<h1 style="margin:16px;font-size:22px">Fotoğraflarım</h1>`}<main>${F.nav?body:feed()}</main>
 ${F.nav?`<nav>${tabs.map(([k,l,i])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${i}<span>${l}</span></button>`).join("")}</nav>`:""}`;
 const ms=document.getElementById("ms");if(ms)ms.scrollTop=ms.scrollHeight}
document.addEventListener("click",e=>{const t=e.target.closest("[data-like],[data-tab],#dk,[data-story],[data-vote]");if(!t)return;
 if(t.dataset.like!=null){const p=posts.find(x=>String(x.id)===t.dataset.like);p.on=!p.on;p.likes+=p.on?1:-1;render()}
 else if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0)}else if(t.id==="dk"){dark=!dark;render()}
 else if(t.dataset.vote!=null){const p=posts.find(x=>x.poll);if(p.poll.my<0){p.poll.my=+t.dataset.vote;p.poll.v[p.poll.my]++;render()}}
 else if(t.dataset.story!=null){const i=+t.dataset.story,d=document.createElement("div");d.className="sv";d.innerHTML=`<div class="bar"><i></i></div><div class="who">${esc(U[i][0])}</div>${photo(i+20)}`;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;
 if(f.id==="cf"){msgs.push([ME,v]);render();setTimeout(()=>{msgs.push([U[0],STAGE>=2?"Görebiliyorum ama yazamıyorum, düzenleme izni yok":"Tamam"]);render()},900)}
 else{const p=posts.find(x=>String(x.id)===f.dataset.cf);p.cm.push([ME,v]);render()}});
document.addEventListener("change",e=>{if(e.target.id!=="pick"||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{posts.unshift({id:"m"+Date.now(),u:ME,src:r.result,cap:"Yeni paylaşım",likes:0,on:false,cm:[]});tab="feed";render()};r.readAsDataURL(e.target.files[0])});
render();
</script></body></html>
